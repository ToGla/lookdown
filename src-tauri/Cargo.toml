[package]
name = "lookdown"
version = "0.2.0"
description = "A lightweight WYSIWYG Markdown viewer and editor"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lookdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tao; used to add applicationShouldTerminate: (src/quit.rs).
objc2 = "0.6.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
toml = "1.2.2"
